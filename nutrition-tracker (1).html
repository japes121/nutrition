<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nutrition">
<title>Nutrition Log</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#f5f5f5;
  --surface:#ffffff;
  --surface2:#efefef;
  --border:rgba(0,0,0,0.08);
  --border-strong:rgba(0,0,0,0.14);
  --text:#111111;
  --text2:#666666;
  --text3:#aaaaaa;
  --kcal:#c0392b;
  --kcal-bg:#fdf2f1;
  --protein:#1a5fa8;
  --protein-bg:#f0f5fc;
  --accent:#1a5fa8;
  --green:#1e7e3e;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --radius:10px;
  --radius-lg:14px
}
@media(prefers-color-scheme:dark){:root{
  --bg:#111111;
  --surface:#1c1c1c;
  --surface2:#272727;
  --border:rgba(255,255,255,0.08);
  --border-strong:rgba(255,255,255,0.14);
  --text:#f0f0f0;
  --text2:#888888;
  --text3:#555555;
  --kcal:#e05c50;
  --kcal-bg:rgba(192,57,43,0.15);
  --protein:#4a8fd4;
  --protein-bg:rgba(26,95,168,0.15);
  --accent:#4a8fd4;
  --green:#34a85a
}}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;font-size:15px;line-height:1.4;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
.app{display:flex;flex-direction:column;height:100%;max-width:430px;margin:0 auto}

/* ── HEADER ── */
.header{background:var(--surface);border-bottom:0.5px solid var(--border-strong);padding:calc(var(--safe-top) + 14px) 18px 16px;flex-shrink:0}
.header-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.app-name{font-size:17px;font-weight:600;letter-spacing:-0.2px;color:var(--text)}
.date-nav{display:flex;align-items:center;gap:0;background:var(--surface2);border-radius:8px;overflow:hidden;border:0.5px solid var(--border-strong)}
.date-nav button{background:none;border:none;color:var(--accent);font-size:17px;padding:5px 11px;cursor:pointer;line-height:1;font-weight:400}
.date-nav button:active{background:var(--border)}
.date-nav button:disabled{color:var(--text3)}
.date-label{font-size:13px;font-weight:500;min-width:76px;text-align:center;color:var(--text);border-left:0.5px solid var(--border-strong);border-right:0.5px solid var(--border-strong);padding:5px 0}

.totals{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.total-card{background:var(--surface2);border-radius:var(--radius);padding:11px 14px;border:0.5px solid var(--border)}
.total-label{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:4px}
.total-val{font-size:24px;font-weight:700;letter-spacing:-0.5px;line-height:1}
.total-val.kcal{color:var(--kcal)}
.total-val.prot{color:var(--protein)}
.total-unit{font-size:12px;font-weight:400;color:var(--text2);margin-left:3px;letter-spacing:0}

/* ── TABS ── */
.tabs{display:flex;background:var(--surface);border-bottom:0.5px solid var(--border-strong);flex-shrink:0}
.tab{flex:1;padding:10px 0;text-align:center;font-size:13px;font-weight:500;color:var(--text2);border-bottom:1.5px solid transparent;cursor:pointer;letter-spacing:0.01em}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}

/* ── SCROLL ── */
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}

/* ── INPUT ── */
.input-section{background:var(--surface);border-bottom:0.5px solid var(--border-strong);padding:12px 16px 10px}
.input-hint{font-size:12px;color:var(--text3);margin-bottom:9px;line-height:1.5}
.input-hint code{font-family:'SF Mono',ui-monospace,monospace;font-size:11px;color:var(--text2);background:var(--surface2);border-radius:4px;padding:1px 5px;letter-spacing:-0.2px}
.input-row{display:flex;gap:7px;position:relative}
.food-input{flex:1;background:var(--surface2);border:0.5px solid var(--border-strong);border-radius:var(--radius);padding:10px 13px;font-size:15px;color:var(--text);outline:none;-webkit-appearance:none;font-family:inherit}
.food-input::placeholder{color:var(--text3)}
.food-input:focus{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 18%,transparent)}
.cam-btn{background:var(--surface2);border:0.5px solid var(--border-strong);border-radius:var(--radius);padding:0 13px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--text2)}
.cam-btn:active{background:var(--border);color:var(--accent)}
.cam-btn svg{display:block}
.add-btn{background:var(--accent);color:#fff;border:none;border-radius:var(--radius);padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer;flex-shrink:0;-webkit-appearance:none;font-family:inherit;letter-spacing:0.01em}
.add-btn:active{opacity:.82}

.parse-preview{margin-top:7px;font-size:12px;min-height:16px;color:var(--text3);letter-spacing:0.01em}
.parse-preview .ok{color:var(--green)}
.parse-preview .warn{color:var(--kcal)}

/* ── AUTOCOMPLETE ── */
.autocomplete{position:absolute;top:calc(100% + 5px);left:0;right:0;background:var(--surface);border:0.5px solid var(--border-strong);border-radius:var(--radius-lg);overflow:hidden;z-index:100;box-shadow:0 6px 24px rgba(0,0,0,0.10)}
.ac-item{display:flex;align-items:center;padding:10px 14px;gap:12px;cursor:pointer;border-bottom:0.5px solid var(--border)}
.ac-item:last-child{border-bottom:none}
.ac-item:active{background:var(--surface2)}
.ac-left{flex:1;min-width:0}
.ac-name{font-size:14px;font-weight:500;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ac-qty{font-size:11px;color:var(--text3);margin-bottom:1px}
.ac-macros{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex-shrink:0}
.ac-kcal{font-size:12px;font-weight:600;color:var(--kcal)}
.ac-prot{font-size:12px;font-weight:500;color:var(--protein)}

/* ── ENTRIES ── */
.entries-header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 7px}
.section-label{font-size:11px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:0.08em}
.macro-legend{display:flex;gap:12px}
.legend-item{font-size:11px;color:var(--text3);display:flex;align-items:center;gap:4px}
.legend-dot{width:6px;height:6px;border-radius:50%;display:inline-block}

.entries-card{background:var(--surface);border-radius:var(--radius-lg);margin:0 12px 12px;overflow:hidden;border:0.5px solid var(--border-strong)}
.entry{display:flex;align-items:center;padding:11px 14px;gap:10px;border-bottom:0.5px solid var(--border)}
.entry:last-child{border-bottom:none}
.entry-name{flex:1;font-size:14px;font-weight:500;color:var(--text);line-height:1.35;letter-spacing:-0.1px}
.entry-macros{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex-shrink:0}
.pill{font-size:11px;font-weight:600;border-radius:5px;padding:2px 7px;letter-spacing:0.01em}
.pill-kcal{color:var(--kcal);background:var(--kcal-bg)}
.pill-prot{color:var(--protein);background:var(--protein-bg)}
.pill-zero{color:var(--text3);background:var(--surface2)}
.del-btn{background:none;border:none;color:var(--text3);font-size:18px;line-height:1;cursor:pointer;padding:4px 3px;border-radius:6px;flex-shrink:0;font-weight:300}
.del-btn:active{color:var(--kcal)}

.empty-state{text-align:center;padding:48px 24px;color:var(--text3);font-size:14px;line-height:1.7}
.empty-rule{width:32px;height:1px;background:var(--border-strong);margin:0 auto 16px}

/* ── HISTORY ── */
.history-list{padding:0 12px 12px}
.history-card{background:var(--surface);border-radius:var(--radius-lg);overflow:hidden;border:0.5px solid var(--border-strong);margin-bottom:10px}
.history-row{display:flex;align-items:center;padding:12px 14px;border-bottom:0.5px solid var(--border);cursor:pointer}
.history-row:last-child{border-bottom:none}
.history-row:active{background:var(--surface2)}
.history-date-col{flex:1}
.h-date{font-size:14px;font-weight:600;color:var(--text)}
.h-count{font-size:11px;color:var(--text3);margin-top:2px;letter-spacing:0.01em}
.h-macros{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.h-kcal{font-size:13px;font-weight:600;color:var(--kcal)}
.h-prot{font-size:11px;font-weight:500;color:var(--protein)}
.h-chevron{color:var(--text3);font-size:16px;font-weight:300;margin-left:10px}

/* ── CAMERA ── */
.cam-overlay{position:fixed;inset:0;background:#000;z-index:200;display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start}
.cam-topbar{display:flex;align-items:center;justify-content:space-between;padding:calc(var(--safe-top) + 14px) 20px 14px;flex-shrink:0}
.cam-title{color:rgba(255,255,255,0.9);font-size:15px;font-weight:600;letter-spacing:-0.1px}
.cam-close-btn{background:rgba(255,255,255,0.12);border:none;color:#fff;border-radius:20px;padding:7px 16px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit}
.cam-close-btn:active{opacity:.7}
.cam-video-wrap{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#000}
.cam-overlay video{width:100%;height:100%;object-fit:cover}
.cam-preview-img{width:100%;height:100%;object-fit:contain}
.cam-bottom{display:flex;flex-direction:column;align-items:center;gap:12px;padding:20px 20px calc(var(--safe-bottom) + 24px);flex-shrink:0;background:#000}
.cam-status{color:rgba(255,255,255,0.55);font-size:13px;letter-spacing:0.01em}
.cam-snap-btn{width:66px;height:66px;border-radius:50%;background:#fff;border:3px solid rgba(255,255,255,0.3);cursor:pointer;display:flex;align-items:center;justify-content:center}
.cam-snap-btn:active{transform:scale(.94);opacity:.9}
.cam-snap-btn svg{display:block}
.cam-snap-btn:disabled{opacity:.3}

/* ── TOAST ── */
.toast{position:fixed;bottom:calc(var(--safe-bottom) + 22px);left:50%;transform:translateX(-50%) translateY(70px);background:rgba(20,20,20,0.88);color:#fff;border-radius:22px;padding:9px 18px;font-size:13px;font-weight:500;z-index:999;transition:transform .22s ease;white-space:nowrap;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);pointer-events:none;letter-spacing:0.01em}
.toast.show{transform:translateX(-50%) translateY(0)}
.section-gap{height:calc(var(--safe-bottom) + 20px)}
</style>
</head>
<body>
<div class="app">

  <!-- HEADER -->
  <div class="header">
    <div class="header-row">
      <div class="app-name">Nutrition Log</div>
      <div class="date-nav">
        <button id="prevDay">&#8249;</button>
        <div class="date-label" id="dateLabel"></div>
        <button id="nextDay">&#8250;</button>
      </div>
    </div>
    <div class="totals">
      <div class="total-card">
        <div class="total-label">Calories</div>
        <div class="total-val kcal"><span id="totalKcal">0</span><span class="total-unit">kcal</span></div>
      </div>
      <div class="total-card">
        <div class="total-label">Protein</div>
        <div class="total-val prot"><span id="totalProtein">0</span><span class="total-unit">g</span></div>
      </div>
    </div>
  </div>

  <!-- TABS -->
  <div class="tabs">
    <div class="tab active" id="tabLog" onclick="showTab('log')">Log</div>
    <div class="tab" id="tabHistory" onclick="showTab('history')">History</div>
  </div>

  <!-- CONTENT -->
  <div class="content">

    <!-- LOG VIEW -->
    <div id="logView">
      <div class="input-section">
        <div class="input-hint">
          Type a quantity or name: <code>3 croissants</code>, <code>chicken rice 1000 76</code>
        </div>
        <div class="input-row" id="inputRow">
          <input class="food-input" id="foodInput" type="text"
            placeholder="e.g. 2 eggs, milk 180 11"
            autocomplete="off" autocorrect="off" autocapitalize="sentences" spellcheck="false"/>
          <button class="cam-btn" id="camBtn" aria-label="Scan food with camera">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
              <circle cx="12" cy="13" r="4"/>
            </svg>
          </button>
          <button class="add-btn" id="addBtn">Add</button>
          <div class="autocomplete" id="autocomplete" style="display:none"></div>
        </div>
        <div class="parse-preview" id="parsePreview"></div>
      </div>

      <div class="entries-header">
        <div class="section-label">Entries</div>
        <div class="macro-legend">
          <span class="legend-item"><span class="legend-dot" style="background:var(--kcal)"></span> kcal</span>
          <span class="legend-item"><span class="legend-dot" style="background:var(--protein)"></span> protein</span>
        </div>
      </div>
      <div id="entriesList"></div>
      <div class="section-gap"></div>
    </div>

    <!-- HISTORY VIEW -->
    <div id="historyView" style="display:none">
      <div class="entries-header">
        <div class="section-label">All days</div>
      </div>
      <div class="history-list" id="historyList"></div>
      <div class="section-gap"></div>
    </div>

  </div>
</div>

<!-- CAMERA OVERLAY -->
<div class="cam-overlay" id="camOverlay" style="display:none">
  <div class="cam-topbar">
    <div class="cam-title">Scan Food</div>
    <button class="cam-close-btn" id="camCancel">Cancel</button>
  </div>
  <div class="cam-video-wrap">
    <video id="camVideo" autoplay playsinline muted style="display:none"></video>
    <canvas id="camCanvas" style="display:none"></canvas>
    <img class="cam-preview-img" id="camPreview" style="display:none"/>
  </div>
  <div class="cam-bottom">
    <div class="cam-status" id="camStatus">Starting camera</div>
    <button class="cam-snap-btn" id="camSnap" aria-label="Take photo">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#111" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"/>
        <circle cx="12" cy="12" r="4" fill="#111" stroke="none"/>
      </svg>
    </button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── STORAGE
const DB_KEY='nutri_v2', MEALS_KEY='nutri_meals_v2';
let currentDate=todayStr(), db={}, meals={};

function todayStr(){ return new Date().toISOString().slice(0,10) }
function offsetDate(d,n){ const x=new Date(d+'T12:00:00'); x.setDate(x.getDate()+n); return x.toISOString().slice(0,10) }
function fmtDate(s){
  const today=todayStr(),yest=offsetDate(today,-1);
  if(s===today) return 'Today';
  if(s===yest) return 'Yesterday';
  return new Date(s+'T12:00:00').toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})
}
function escHtml(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;') }
function load(){
  try{ const r=localStorage.getItem(DB_KEY); if(r) db=JSON.parse(r) }catch(e){ db={} }
  try{ const r=localStorage.getItem(MEALS_KEY); if(r) meals=JSON.parse(r) }catch(e){ meals={} }
}
function save(){ localStorage.setItem(DB_KEY,JSON.stringify(db)) }
function saveMeals(){ localStorage.setItem(MEALS_KEY,JSON.stringify(meals)) }

function learnMeal(name,kcal,protein){
  const key=name.toLowerCase().trim();
  if(!meals[key]) meals[key]={name,kcal,protein,count:0};
  if(kcal>0){
    const m=meals[key];
    m.kcal=Math.round((m.kcal*m.count+kcal)/(m.count+1));
    m.protein=Math.round((m.protein*m.count+protein)/(m.count+1));
    m.name=name;
  }
  meals[key].count++;
  saveMeals();
}

// ── PARSING
const WORD_NUMS={one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,half:0.5,a:1,an:1};
function singularise(w){
  if(w.length>4&&w.endsWith('ies')) return w.slice(0,-3)+'y';
  if(w.length>4&&w.endsWith('oes')) return w.slice(0,-2);
  if(w.length>3&&w.endsWith('s'))   return w.slice(0,-1);
  return w;
}
function parseLine(line){
  line=line.trim(); if(!line) return null;
  let qty=1,rest=line;
  const leadNum=line.match(/^(\d+(?:\.\d+)?)\s+(.+)/);
  if(leadNum){ qty=parseFloat(leadNum[1]); rest=leadNum[2]; }
  else { const p=line.split(/\s+/),wn=WORD_NUMS[p[0].toLowerCase()]; if(wn!==undefined){ qty=wn; rest=p.slice(1).join(' '); } }
  const numRe=/\d+(?:\.\d+)?/g; const nums=[]; let m;
  while((m=numRe.exec(rest))!==null) nums.push({val:parseFloat(m[0]),idx:m.index});
  if(nums.length>=2){
    const n1=nums[nums.length-2],n2=nums[nums.length-1];
    const namePart=rest.slice(0,n1.idx).trim();
    if(namePart.length>0&&n1.val>=10&&n2.val>=0){
      return {name:namePart.replace(/[,\s]+$/,'').trim()||'Food',kcal:Math.round(n1.val*qty),protein:Math.round(n2.val*qty),qty,explicit:true};
    }
  }
  if(nums.length===1){
    const n=nums[0]; const namePart=rest.slice(0,n.idx).trim();
    if(namePart.length>0&&n.val>=10){
      return {name:namePart.replace(/[,\s]+$/,'').trim()||'Food',kcal:Math.round(n.val*qty),protein:0,qty,explicit:true};
    }
  }
  const cleanName=rest.replace(/[,\s]+$/,'').trim();
  const singular=singularise(cleanName.toLowerCase());
  const match=findMeal(singular)||findMeal(cleanName.toLowerCase());
  if(match){
    return {name:qty!==1?`${Number.isInteger(qty)?qty:qty} \u00d7 ${match.name}`:match.name,displayName:match.name,
            kcal:Math.round(match.kcal*qty),protein:Math.round(match.protein*qty),qty,fromMemory:true};
  }
  if(cleanName) return {name:cleanName,kcal:0,protein:0,qty,noMacros:true};
  return null;
}
function findMeal(key){
  if(meals[key]) return meals[key];
  const keys=Object.keys(meals);
  for(const k of keys){ if(k.startsWith(key)&&key.length>=3) return meals[k] }
  for(const k of keys){ if(k.includes(key)&&key.length>=4) return meals[k] }
  return null;
}

// ── AUTOCOMPLETE
function getSuggestions(raw){
  if(!raw||raw.length<1) return [];
  let qty=1,search=raw.toLowerCase().trim();
  const ln=raw.match(/^(\d+(?:\.\d+)?)\s+(.+)/);
  if(ln){ qty=parseFloat(ln[1]); search=ln[2].toLowerCase(); }
  else { const p=search.split(/\s+/),wn=WORD_NUMS[p[0]]; if(wn!==undefined){ qty=wn; search=p.slice(1).join(' '); } }
  if(!search) return [];
  const sing=singularise(search),results=[];
  for(const [k,v] of Object.entries(meals)){
    if(k.startsWith(sing)||k.startsWith(search)||k.includes(search)){
      results.push({...v,suggestedQty:qty,kcalScaled:Math.round(v.kcal*qty),proteinScaled:Math.round(v.protein*qty)});
    }
  }
  results.sort((a,b)=>b.count-a.count);
  return results.slice(0,4);
}

// ── UI
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2200);
}
function updateTotals(){
  const es=db[currentDate]||[];
  document.getElementById('totalKcal').textContent=es.reduce((s,e)=>s+(e.kcal||0),0);
  document.getElementById('totalProtein').textContent=es.reduce((s,e)=>s+(e.protein||0),0);
  document.getElementById('nextDay').disabled=currentDate>=todayStr();
}
function renderEntries(){
  updateTotals();
  const es=db[currentDate]||[];
  const c=document.getElementById('entriesList');
  if(!es.length){
    c.innerHTML=`<div class="empty-state"><div class="empty-rule"></div>No entries for ${fmtDate(currentDate)}</div>`;
    return;
  }
  c.innerHTML=`<div class="entries-card">${es.map((e,i)=>`
    <div class="entry">
      <div class="entry-name">${escHtml(e.name)}</div>
      <div class="entry-macros">
        <span class="pill pill-kcal">${e.kcal} kcal</span>
        <span class="pill ${e.protein===0?'pill-zero':'pill-prot'}">${e.protein}g protein</span>
      </div>
      <button class="del-btn" onclick="deleteEntry(${i})">&#215;</button>
    </div>`).join('')}</div>`;
}
function renderHistory(){
  const days=Object.keys(db).filter(d=>db[d]&&db[d].length).sort((a,b)=>b.localeCompare(a));
  const list=document.getElementById('historyList');
  if(!days.length){ list.innerHTML='<div class="empty-state"><div class="empty-rule"></div>No history yet</div>'; return; }
  list.innerHTML=`<div class="history-card">${days.map(day=>{
    const es=db[day],kcal=es.reduce((s,e)=>s+(e.kcal||0),0),prot=es.reduce((s,e)=>s+(e.protein||0),0);
    return `<div class="history-row" onclick="goToDay('${day}')">
      <div class="history-date-col">
        <div class="h-date">${fmtDate(day)}</div>
        <div class="h-count">${es.length} item${es.length!==1?'s':''}</div>
      </div>
      <div class="h-macros">
        <div class="h-kcal">${kcal} kcal</div>
        <div class="h-prot">${prot}g protein</div>
      </div>
      <div class="h-chevron">&#8250;</div>
    </div>`;
  }).join('')}</div>`;
}
function showTab(tab){
  document.getElementById('logView').style.display=tab==='log'?'':'none';
  document.getElementById('historyView').style.display=tab==='history'?'':'none';
  document.getElementById('tabLog').classList.toggle('active',tab==='log');
  document.getElementById('tabHistory').classList.toggle('active',tab==='history');
  if(tab==='history') renderHistory();
}
function updateDateLabel(){
  document.getElementById('dateLabel').textContent=fmtDate(currentDate);
  document.getElementById('nextDay').disabled=currentDate>=todayStr();
}
function goToDay(day){ currentDate=day; updateDateLabel(); showTab('log'); renderEntries(); }
window.deleteEntry=function(idx){
  if(!db[currentDate]) return;
  const name=db[currentDate][idx]?.name||'Entry';
  db[currentDate].splice(idx,1);
  if(!db[currentDate].length) delete db[currentDate];
  save(); renderEntries(); showToast('Removed');
};

// ── INPUT + AUTOCOMPLETE
const input=document.getElementById('foodInput');
const preview=document.getElementById('parsePreview');
const acDiv=document.getElementById('autocomplete');

function hideAc(){ acDiv.style.display='none'; }
function showAc(sugs,qty){
  if(!sugs.length){ hideAc(); return; }
  acDiv.innerHTML=sugs.map((s,i)=>`
    <div class="ac-item" onclick="pickSuggestion(${i})">
      <div class="ac-left">
        ${qty>1?`<div class="ac-qty">${qty} &times;</div>`:''}
        <div class="ac-name">${escHtml(s.name)}</div>
      </div>
      <div class="ac-macros">
        <span class="ac-kcal">${s.kcalScaled} kcal</span>
        <span class="ac-prot">${s.proteinScaled}g</span>
      </div>
    </div>`).join('');
  acDiv._sugs=sugs; acDiv.style.display='';
}
window.pickSuggestion=function(i){
  const s=acDiv._sugs[i];
  const entry={name:s.suggestedQty>1?`${s.suggestedQty} \u00d7 ${s.name}`:s.name,kcal:s.kcalScaled,protein:s.proteinScaled};
  addEntryToLog(entry); learnMeal(s.name.toLowerCase(),s.kcal,s.protein);
  input.value=''; preview.innerHTML=''; hideAc();
};
input.addEventListener('input',()=>{
  const val=input.value.trim();
  if(!val){ preview.innerHTML=''; hideAc(); return; }
  const parsed=parseLine(val);
  let qty=1; const ln=val.match(/^(\d+(?:\.\d+)?)\s/); if(ln) qty=parseFloat(ln[1]);
  showAc(getSuggestions(val),qty);
  if(!parsed){ preview.innerHTML='<span class="warn">Add calories after the name, e.g. Milk 180 11</span>'; return; }
  if(parsed.noMacros){ preview.innerHTML=`<span class="warn">Unknown food — add calories: ${escHtml(parsed.name)} 360 7</span>`; return; }
  if(parsed.fromMemory){
    const p=parsed.protein>0?` &middot; ${parsed.protein}g protein`:'';
    preview.innerHTML=`<span class="ok">From memory &mdash; ${parsed.kcal} kcal${p}</span>`; return;
  }
  if(parsed.explicit){
    const p=parsed.protein>0?` &middot; ${parsed.protein}g protein`:'';
    preview.innerHTML=`<span class="ok">${escHtml(parsed.name)} &mdash; ${parsed.kcal} kcal${p}</span>`;
  }
});
input.addEventListener('keydown',e=>{ if(e.key==='Enter'){ hideAc(); doAdd(); } });
document.addEventListener('click',e=>{ if(!document.getElementById('inputRow').contains(e.target)) hideAc(); });
document.getElementById('addBtn').addEventListener('click',()=>{ hideAc(); doAdd(); });

function doAdd(){
  const val=input.value.trim(); if(!val) return;
  const parsed=parseLine(val);
  if(!parsed||parsed.noMacros){
    preview.innerHTML=`<span class="warn">Add calories after name, e.g. ${escHtml(val||'Croissant')} 360 7</span>`; return;
  }
  addEntryToLog({name:parsed.name,kcal:parsed.kcal,protein:parsed.protein});
  const bk=parsed.qty>0?Math.round(parsed.kcal/parsed.qty):parsed.kcal;
  const bp=parsed.qty>0?Math.round(parsed.protein/parsed.qty):parsed.protein;
  const bn=(parsed.displayName||parsed.name).replace(/^\d[\d.]*\s*\u00d7\s*/,'').trim();
  learnMeal(bn.toLowerCase(),bk,bp);
  input.value=''; preview.innerHTML=''; hideAc();
}
function addEntryToLog(entry){
  if(!db[currentDate]) db[currentDate]=[];
  db[currentDate].push(entry); save(); renderEntries(); showToast('Added');
}

// ── DATE NAV
document.getElementById('prevDay').addEventListener('click',()=>{ currentDate=offsetDate(currentDate,-1); updateDateLabel(); renderEntries(); });
document.getElementById('nextDay').addEventListener('click',()=>{ const n=offsetDate(currentDate,1); if(n>todayStr()) return; currentDate=n; updateDateLabel(); renderEntries(); });

// ── CAMERA
const CLAUDE_MODEL='claude-sonnet-4-20250514';
let camStream=null;

document.getElementById('camBtn').addEventListener('click',openCamera);
document.getElementById('camCancel').addEventListener('click',closeCamera);
document.getElementById('camSnap').addEventListener('click',snapPhoto);

async function openCamera(){
  const overlay=document.getElementById('camOverlay');
  const video=document.getElementById('camVideo');
  const status=document.getElementById('camStatus');
  const snapBtn=document.getElementById('camSnap');
  const previewImg=document.getElementById('camPreview');
  previewImg.style.display='none'; previewImg.src='';
  video.style.display='none'; snapBtn.disabled=false;
  status.textContent='Starting camera';
  overlay.style.display='flex';
  try{
    camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false});
    video.srcObject=camStream; video.style.display='';
    status.textContent='Point at your food and tap the button';
  }catch(err){
    status.textContent='Camera unavailable: '+err.message; snapBtn.disabled=true;
  }
}
function closeCamera(){
  if(camStream){ camStream.getTracks().forEach(t=>t.stop()); camStream=null; }
  document.getElementById('camOverlay').style.display='none';
  document.getElementById('camVideo').srcObject=null;
}
async function snapPhoto(){
  const video=document.getElementById('camVideo');
  const canvas=document.getElementById('camCanvas');
  const status=document.getElementById('camStatus');
  const snapBtn=document.getElementById('camSnap');
  const previewImg=document.getElementById('camPreview');
  canvas.width=video.videoWidth||640; canvas.height=video.videoHeight||480;
  canvas.getContext('2d').drawImage(video,0,0,canvas.width,canvas.height);
  const dataUrl=canvas.toDataURL('image/jpeg',0.85);
  previewImg.src=dataUrl; previewImg.style.display=''; video.style.display='none';
  snapBtn.disabled=true; status.textContent='Analysing';
  if(camStream){ camStream.getTracks().forEach(t=>t.stop()); camStream=null; }
  try{
    const resp=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        model:CLAUDE_MODEL, max_tokens:400,
        messages:[{role:'user',content:[
          {type:'image',source:{type:'base64',media_type:'image/jpeg',data:dataUrl.split(',')[1]}},
          {type:'text',text:'Look at this food photo and estimate macros. Respond ONLY with a JSON array, no markdown. Each item: {"name":"food name","kcal":number,"protein":number}. Estimate realistic portions. If multiple foods list each separately. If no food return [].'}
        ]}]
      })
    });
    const data=await resp.json();
    const text=data.content?.filter(b=>b.type==='text').map(b=>b.text).join('');
    if(!text) throw new Error('No response');
    const items=JSON.parse(text.replace(/```json|```/g,'').trim());
    closeCamera();
    if(!Array.isArray(items)||!items.length){ showToast('Could not identify food'); return; }
    for(const item of items){
      if(item.name&&item.kcal>=0){
        addEntryToLog({name:item.name,kcal:Math.round(item.kcal||0),protein:Math.round(item.protein||0)});
        learnMeal(item.name.toLowerCase(),Math.round(item.kcal||0),Math.round(item.protein||0));
      }
    }
    showToast(`Added ${items.length} item${items.length!==1?'s':''} from photo`);
  }catch(err){
    status.textContent='Could not analyse photo';
    snapBtn.disabled=false; video.style.display=''; previewImg.style.display='none';
    try{ camStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false}); video.srcObject=camStream; }catch(e){}
  }
}

// ── INIT
load(); updateDateLabel(); renderEntries();
</script>
